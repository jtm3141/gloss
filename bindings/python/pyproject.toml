[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gloss-dict"
version = "0.1.0"
description = "A dead-simple dictionary for everyone, everywhere — powered by Open English WordNet"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
