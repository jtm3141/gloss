# CI for gloss

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sqlite3.c / sqlite3.h are intentionally not committed (9MB+ of
      # generated source); fetch the pinned amalgamation instead.
      # (unzip, not tar: GNU tar cannot extract .zip files.)
      - name: Fetch SQLite amalgamation
        shell: bash
        run: |
          curl -sSL -o /tmp/sqlite.zip https://www.sqlite.org/2026/sqlite-amalgamation-3530400.zip
          mkdir -p /tmp/sqli && unzip -q /tmp/sqlite.zip -d /tmp/sqli
          cp /tmp/sqli/sqlite-amalgamation-3530400/sqlite3.c /tmp/sqli/sqlite-amalgamation-3530400/sqlite3.h core/

      # windows-latest ships mingw-w64 but not on PATH; wire it up (no network).
      - name: Set up gcc (Windows)
        if: runner.os == 'Windows'
        run: |
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if (-not $gcc) {
            foreach ($p in @('C:\mingw64\bin', 'C:\msys64\mingw64\bin')) {
              if (Test-Path "$p\gcc.exe") { Add-Content $env:GITHUB_PATH $p; break }
            }
          }
          gcc --version

      # The one dataset: reproducible from the versioned OEWN download.
      - name: Build gloss.db
        run: python data/build_db.py --download

      # Taboo/offensive flags: reproducible from the versioned list downloads.
      - name: Build content flags
        run: python data/build_flags.py --db data/gloss.db

      - name: Content-filter safety tests
        run: python data/test_safety.py --db data/gloss.db

      - name: Generate conformance fixtures
        run: python data/gen_conformance.py

      # The one engine: C99 core, tested against the fixtures via ctypes.
      - name: C core conformance (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          gcc -O2 -shared -fPIC -o core/libgloss.so core/gloss.c core/sqlite3.c -Icore
          python core/test_conformance.py
      - name: C core conformance (Windows)
        if: runner.os == 'Windows'
        run: python core/test_conformance.py

      # Python binding (stdlib sqlite3 backend).
      - name: Python binding conformance
        run: |
          cd bindings/python
          python tests/test_conformance.py ../../data/gloss.db

      # C++ header: must at least compile and run its smoke test.
      # (sqlite3.c/gloss.c are C: compile with gcc, link into the C++ test.)
      - name: C++ binding smoke test
        run: |
          cd bindings/cpp
          gcc -O2 -c ../../core/sqlite3.c -o sqlite3.o -I../../core
          gcc -O2 -c ../../core/gloss.c -o gloss.o -I../../core
          g++ -O2 -std=c++17 -I../../core -o test_cpp test_cpp.cpp gloss.o sqlite3.o
          ./test_cpp ../../data/gloss.db

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # JS binding.
      - name: JS binding smoke test
        shell: bash
        run: |
          cd bindings/js
          npm ci
          npm run build
          GLOSS_DB=../../data/gloss.db npm run smoke
